services:
  - type: web
    name: promptvision-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
      - key: DEFAULT_VISION_MODEL
        value: qwen2.5vl:3b
      - key: DEFAULT_NUM_CTX
        value: "4096"
      - key: MAX_CONCURRENT_MODELS
        value: "1"
      - key: INFERENCE_TIMEOUT
        value: "300"
